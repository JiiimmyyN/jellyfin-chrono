name: "Registry: add a title"
description: Add a movie, a season or a whole series to an existing universe.
title: "[Registry] Add <title> to <universe>"
labels: ["registry", "registry:add-title"]
body:
  - type: markdown
    attributes:
      value: |
        Requests are applied automatically after a maintainer approves them. IDs, titles and dates are looked up from TMDB/Wikidata/TVmaze.
        Entry and order ids are listed in the universe file, e.g. [registry/universes/mcu.json](https://github.com/JiiimmyyN/jellyfin-chrono/blob/main/registry/universes/mcu.json).
  - type: input
    id: universe
    attributes:
      label: Universe
      description: Universe id, e.g. `mcu` or `star-wars`.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Title type
      options:
        - Movie
        - Seasons of a series
        - Whole series (one entry)
    validations:
      required: true
  - type: input
    id: tmdb
    attributes:
      label: TMDB ID
      description: Number or themoviedb.org URL, e.g. `1726` or `https://www.themoviedb.org/movie/1726-iron-man`. For series use the series id (`/tv/<id>`).
    validations:
      required: true
  - type: input
    id: seasons
    attributes:
      label: Seasons
      description: Only for "Seasons of a series". `1`, `1-3`, `1,3`. Leave empty for every aired season.
  - type: textarea
    id: placement
    attributes:
      label: Placement
      description: |
        One line per timeline: `<order-id> after <entry-id>`, `<order-id> before <entry-id>`, `<order-id> first` or `<order-id> last`.
        Only explicit orders (e.g. `timeline`, `official-timeline`) take placements; release order, phases and other derived rows update themselves.
      placeholder: |
        timeline after loki-s1
      render: text
  - type: input
    id: groups
    attributes:
      label: Groups
      description: Comma-separated group ids, e.g. `phase-6` or `reign-of-the-empire`.
  - type: input
    id: flags
    attributes:
      label: Flags
      description: Comma-separated flag ids, e.g. `animated`, `marvel-television`.
  - type: input
    id: title-override
    attributes:
      label: Title override
      description: Optional. Used when the lookup has no data yet (with a release date override).
  - type: input
    id: released-override
    attributes:
      label: Release date override
      description: Optional, `YYYY-MM-DD`.
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Optional note stored on the entry, e.g. why it is placed there.
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: Where the placement comes from (official timeline, wiki page, …).
