name: Claude

# Answers @claude mentions in issue and pull request comments and reviews.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only people with write access to the repository can start Claude.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: anthropics/claude-code-action@v1
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch"
            --append-system-prompt "For changes to the universe registry (registry/), follow docs/registry-requests.md, registry/schema/universe.schema.json and the conventions in registry/universes/mcu.json. Verify every TMDB/IMDb/TVDB id and date you add (TMDB API with the key in $TMDB_API_KEY when set, Wikidata SPARQL, TVmaze); never guess an id and never print $TMDB_API_KEY. Bump the revision of every universe you change to today's date (YYYY.MM.DD, or YYYY.MM.DD.N). Before committing, both must pass: dotnet run --project tools/Chrono.RegistryTool -- validate registry, and dotnet test tests/Jellyfin.Plugin.Chrono.Tests."
