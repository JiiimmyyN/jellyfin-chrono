name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          parts=$(echo "$tag" | tr '.' '\n' | wc -l)
          version="$tag"; for _ in $(seq "$parts" 3); do version="$version.0"; done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          (cd web && pnpm install --frozen-lockfile && pnpm test)
          dotnet run --project tools/Chrono.RegistryTool -- validate registry
          dotnet test tests/Jellyfin.Plugin.Chrono.Tests
      - name: Package
        id: package
        run: echo "zip=$(scripts/package.sh ${{ steps.version.outputs.version }} | tail -1)" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update plugin repository manifest
        run: |
          zip="${{ steps.package.outputs.zip }}"
          url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$(basename "$zip")"
          python3 scripts/update-manifest.py "${{ steps.version.outputs.version }}" "$(cat "$zip.md5")" "$url" "See $GITHUB_REF_NAME release notes."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Update manifest for $GITHUB_REF_NAME"
          git push origin main
